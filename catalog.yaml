# 技能总目录（homemade + external）。提交到 git，跨机器共享。
# local.yaml（每台机器的选择，gitignored）从这里挑选。
# 字段说明见 docs/install-design.md。
version: 1

homemade:
  - name: notify-user
    path: skills/notify-user
    desc: 长任务完成、重要里程碑或需要介入时，通过 OSC 9 通知用户

  - name: feishu-claude-bridge
    path: skills/feishu-claude-bridge
    desc: 从飞书远控/通知本机 Claude Code（lark-channel-bridge）

  - name: plannotator-feedback
    path: skills/plannotator-feedback
    desc: 在 VS Code 内批注文档、目录或代码更改，等待反馈并自动修改、复审

external:
  # ── git 类：clone 进当前 --target 的 skills 目录 ─────────────────────
  - name: frontend-slides
    kind: git
    url: https://github.com/zarazhangrui/frontend-slides.git
    desc: 从零或 PPT 生成动画丰富的 HTML 演示文稿

  - name: ncu-cuda-profiling
    kind: git
    url: https://github.com/maxiaosong1124/ncu-cuda-profiling-skill.git
    desc: NCU (Nsight Compute) 自动化 profiling 工作流

  # ── plugin 类：claude plugin marketplace add + install ─────────────────
  # （按需开启。plugin 粒度是整个插件，会带来该插件全部 skill。）
  # marketplace = `claude plugin marketplace add` 的源（github owner/repo 或 url）
  # id = `claude plugin install` 与 `plugin list --json` 用的 plugin@marketplace注册名
  - name: superpowers
    kind: plugin
    marketplace: anthropics/claude-plugins-official
    id: superpowers@claude-plugins-official
    desc: TDD / debugging / 计划等工作流 skill 集

  - name: frontend-design
    kind: plugin
    marketplace: anthropics/claude-plugins-official
    id: frontend-design@claude-plugins-official
    desc: 高质量前端界面生成 skill

  - name: document-skills
    kind: plugin
    marketplace: anthropics/skills
    id: document-skills@anthropic-agent-skills
    desc: xlsx/docx/pptx/pdf 文档处理 skill 集

  - name: clangd-lsp
    kind: plugin
    marketplace: anthropics/claude-plugins-official
    id: clangd-lsp@claude-plugins-official
    desc: clangd LSP（C/C++）

  - name: pyright-lsp
    kind: plugin
    marketplace: anthropics/claude-plugins-official
    id: pyright-lsp@claude-plugins-official
    desc: pyright LSP（Python）

  - name: code-simplifier
    kind: plugin
    marketplace: anthropics/claude-plugins-official
    id: code-simplifier@claude-plugins-official
    desc: 代码简化/重构 skill
